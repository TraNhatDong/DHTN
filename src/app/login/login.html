<div class="login-page">

  <!-- HEADER -->
  <div class="login-header">
    <div class="brand-header">
      <!-- Logo / brand content can be placed here -->
    </div>
  </div>

  <!-- MAIN BODY -->
  <div class="login-main">

    <!-- Brand panel -->
    <div class="brand-panel">
      <div class="brand-content">
        <!-- Optional brand text or illustration -->
      </div>
    </div>

    <!-- Login panel -->
    <div class="login-panel">
      <div class="login-container">

        <div class="login-title">Đăng nhập</div>

        <form class="login-form" (ngSubmit)="onLogin()">

          <div class="form-group">
            <label for="username">Tên đăng nhập</label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">♙</span>
              <input
                id="username"
                name="username"
                type="text"
                placeholder="Nhập tên đăng nhập"
                autocomplete="username"
                [(ngModel)]="username"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>

            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">♙</span>
              <input
                id="password"
                name="password"
                [type]="showPassword ? 'text' : 'password'"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                [(ngModel)]="password"
                required
              />

              <button
                class="password-toggle"
                type="button"
                (click)="showPassword = !showPassword"
                [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
              >
                {{ showPassword ? 'Ẩn' : 'Hiện' }}
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-option">
              <input
                type="checkbox"
                [(ngModel)]="rememberMe"
                name="rememberMe"
              />
              <span>Ghi nhớ đăng nhập</span>
            </label>

            <a href="/forgot-password">Quên mật khẩu?</a>
          </div>

          <button class="login-button" type="submit">
            <span>Đăng nhập</span>
            <span class="button-arrow" aria-hidden="true">→</span>
          </button>

          <div class="form-divider">
            <span></span>
            <small>Hoặc</small>
            <span></span>
          </div>

          <button
            class="otp-button"
            type="button"
            (click)="onLoginWithOtp()"
          >
            <span class="otp-icon" aria-hidden="true">◇</span>
            Đăng nhập bằng OTP
          </button>

        </form>

        <div class="register-prompt">
          Chưa có tài khoản?
          <a href="/register">Đăng ký ngay</a>
        </div>

      </div>
    </div>

  </div>

  <!-- FOOTER -->
  <div class="login-footer"></div>

</div>
